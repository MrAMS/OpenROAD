name: 📦 Create Snapshot Release

on:
  push:
    tags:
      - 'v*' # 匹配 v1.0, v2.0-beta, v-snapshot 等
      - 'snapshot-*' # 匹配 snapshot-c80e

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 步骤 1：签出当前仓库的代码 (并拉取子模块)
      - name: 1. 🏁 Checkout Current Repo Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          
      # 步骤 2：打包 (包含所有子模块)
      - name: 2. 📦 Package (with submodules)
        run: |
          # GITHUB_REF_NAME 是 CI 被触发时的 tag 名字 (例如 "v1.0-snapshot")
          TAR_NAME="${{ github.ref_name }}.tar.gz"
          
          echo "Creating tarball: $TAR_NAME..."
          
          tar --exclude=.git \
              --exclude=.github \
              --exclude="$TAR_NAME" \
              -czvf "$TAR_NAME" .
          
          echo "::set-output name=tar_name::$TAR_NAME"
        id: package

      # 步骤 3：计算 SHA256 (无变动)
      - name: 3. 🧮 Calculate SHA256
        run: |
          TAR_NAME="${{ steps.package.outputs.tar_name }}"
          SHA_NAME="${TAR_NAME}.sha256"
          
          echo "Calculating SHA256..."
          sha256sum "$TAR_NAME" | cut -d' ' -f1 > "$SHA_NAME"
          
          echo "::set-output name=sha_name::$SHA_NAME"
        id: sha

      # 步骤 4：创建 GitHub Release (无变动)
      - name: 4. 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
              --notes "Automated release snapshot including all submodules for commit ${{ github.sha }}." \
              --title "Snapshot ${{ github.ref_name }}" \
              "${{ steps.package.outputs.tar_name }}" \
              "${{ steps.sha.outputs.sha_name }}"
          
          echo "✅ Release created successfully!"