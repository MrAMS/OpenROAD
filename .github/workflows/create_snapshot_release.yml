name: 📦 Create Snapshot Release

on:
  push:
    tags:
      - 'v*' 
      - 'snapshot-*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 🏁 Checkout Current Repo Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          
      - name: 2. 📦 Package (with submodules)
        run: |
          TAR_NAME="${{ github.ref_name }}.tar.gz"
          echo "Creating tarball: $TAR_NAME..."
          
          # 输出到父目录避免冲突
          tar --exclude=.git \
              --exclude=.github \
              -czvf "../$TAR_NAME" .
          
          # 移回当前目录
          mv "../$TAR_NAME" .
          
          echo "tar_name=$TAR_NAME" >> $GITHUB_OUTPUT
        id: package

      - name: 3. 🧮 Calculate SHA256
        run: |
          TAR_NAME="${{ steps.package.outputs.tar_name }}"
          SHA_NAME="${TAR_NAME}.sha256"
          
          echo "Calculating SHA256..."
          sha256sum "$TAR_NAME" | cut -d' ' -f1 > "$SHA_NAME"
          
          echo "sha_name=$SHA_NAME" >> $GITHUB_OUTPUT
        id: sha

      - name: 4. 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
              --notes "Automated release snapshot including all submodules for commit ${{ github.sha }}." \
              --title "Snapshot ${{ github.ref_name }}" \
              "${{ steps.package.outputs.tar_name }}" \
              "${{ steps.sha.outputs.sha_name }}"
          
          echo "✅ Release created successfully!"