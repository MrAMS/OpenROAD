name: 📦 Publish Bzlmod Snapshot Release

on:
  push:
    branches:
      - "**" # 触发所有分支的push事件
    tags:
      - "v*"
      - "snapshot-*" # 你可以通过这个命令触发：git tag "snapshot-$(git rev-parse HEAD)" && git push origin "snapshot-$(git rev-parse HEAD)"

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许 gh cli 创建 release

    steps:
      - name: 1. 🏁 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: 2. 🏷️ Generate Release Tag and Module Name
        id: generate_tag
        run: |
          # 生成日期+hash格式的tag: snapshot-YYYYMMDD-shortSHA
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_NAME="snapshot-${DATE}-${SHORT_SHA}"

          # 从 github.repository (格式: owner/repo) 中提取 repo 名称并转为小写
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')

          echo "Generated tag: $TAG_NAME"
          echo "Module name: $REPO_NAME"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "module_name=$REPO_NAME" >> $GITHUB_OUTPUT

      - name: 3. 📦 Create Source Tarball (incl. submodules)
        id: package
        run: |
          TAR_NAME="${{ steps.generate_tag.outputs.tag_name }}.tar.gz"
          echo "Creating tarball: $TAR_NAME..."

          # 安全的做法：在被打包目录之外创建 tarball
          tar --exclude=.git \
              --exclude=.github \
              -czvf "../$TAR_NAME" .

          # 将 tarball 移回当前目录，以便后续步骤上传
          mv "../$TAR_NAME" .

          echo "tar_name=$TAR_NAME" >> $GITHUB_OUTPUT

      - name: 3. 🧮 Calculate Bzlmod Integrity Hash (sha256-base64)
        id: sha
        run: |
          TAR_NAME="${{ steps.package.outputs.tar_name }}"
          SHA_NAME="${TAR_NAME}.sha256"

          # 计算 Bzlmod 期望的 sha256-base64 格式
          BASE64_HASH=$(sha256sum "$TAR_NAME" | cut -d' ' -f1 | xxd -r -p | base64 -w0)
          INTEGRITY_STRING="sha256-${BASE64_HASH}"

          echo "Calculated Integrity: $INTEGRITY_STRING"
          echo "$INTEGRITY_STRING" > "$SHA_NAME"

          echo "integrity_string=$INTEGRITY_STRING" >> $GITHUB_OUTPUT
          echo "sha_name=$SHA_NAME" >> $GITHUB_OUTPUT

      - name: 4. 🚀 Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 准备 Release Notes, 包含完整的 Bzlmod 代码片段
          NOTES=$(cat <<EOF
          Automated release for commit \`${{ github.sha }}\`.

          ---

          ### 🎯 Bzlmod Configuration

          To use this release in your \`MODULE.bazel\` file, add the following override:

          \`\`\`bzl
          archive_override(
              module_name = "${{ steps.generate_tag.outputs.module_name }}",
              urls = ["https://github.com/${{ github.repository }}/releases/download/${{ steps.generate_tag.outputs.tag_name }}/${{ steps.package.outputs.tar_name }}"],
              integrity = "${{ steps.sha.outputs.integrity_string }}",
          )
          \`\`\`
          EOF
          )

          # 如果 release 已存在，先删除它（允许失败）
          echo "Checking if release ${{ steps.generate_tag.outputs.tag_name }} already exists..."
          gh release delete ${{ steps.generate_tag.outputs.tag_name }} --yes --cleanup-tag 2>/dev/null || echo "Release does not exist or failed to delete, continuing..."

          # 创建 Release 并上传 tarball 和 sha256 文件
          gh release create ${{ steps.generate_tag.outputs.tag_name }} \
              --notes "$NOTES" \
              --title "Snapshot ${{ steps.generate_tag.outputs.tag_name }}" \
              "${{ steps.package.outputs.tar_name }}" \
              "${{ steps.sha.outputs.sha_name }}"

          echo "✅ Release created successfully!"
